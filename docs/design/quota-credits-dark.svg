<svg xmlns="http://www.w3.org/2000/svg" width="390" height="570" viewBox="0 0 390 570" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">
  <title>用量显示设计参考 · 积分制订阅（start-plan credit）· 深色</title>
  <rect width="390" height="570" fill="#12181D"/>

  <!-- 顶栏（上下文） -->
  <rect x="16" y="16" width="40" height="40" rx="10" fill="#7EC3DF"/>
  <text x="36" y="36" font-size="20" font-weight="700" fill="#0C2A38" text-anchor="middle" dominant-baseline="middle">Z</text>
  <text x="68" y="38" font-size="20" font-weight="600" fill="#DEE7EA">ZCode Proxy</text>
  <text x="68" y="54" font-size="12" fill="#9DAEB6">本地反向代理 · 已连接</text>

  <!-- 英雄卡 -->
  <rect x="16" y="72" width="358" height="258" rx="24" fill="#17475E"/>

  <!-- 状态行 -->
  <circle cx="41" cy="96" r="9" fill="#5BC89B" fill-opacity="0.18"/>
  <circle cx="41" cy="96" r="5" fill="#5BC89B"/>
  <text x="56" y="96" font-size="20" font-weight="600" fill="#D9EEF6" dominant-baseline="middle">运行中</text>
  <rect x="258" y="84" width="96" height="24" rx="12" fill="#7EC3DF" fill-opacity="0.14"/>
  <text x="306" y="96" font-size="12" font-family="ui-monospace,Consolas,monospace" fill="#D9EEF6" text-anchor="middle" dominant-baseline="middle">start-plan</text>

  <!-- 地址行 -->
  <text x="36" y="144" font-size="24" font-weight="600" font-family="ui-monospace,Consolas,monospace" fill="#D9EEF6" dominant-baseline="middle">127.0.0.1:8317</text>
  <rect x="290" y="128" width="64" height="32" rx="16" fill="none" stroke="#7EC3DF" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="300" y="136" width="10" height="12" rx="2" fill="none" stroke="#D9EEF6" stroke-opacity="0.85" stroke-width="1.5"/>
  <rect x="305" y="141" width="10" height="12" rx="2" fill="#17475E" stroke="#D9EEF6" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="332" y="145" font-size="13" fill="#D9EEF6" text-anchor="middle" dominant-baseline="middle">复制</text>

  <!-- ★ 用量块（替换「近 60 分钟请求」，同原块位置与体量） -->
  <text x="36" y="188" font-size="11" fill="#D9EEF6" fill-opacity="0.65" dominant-baseline="middle">套餐用量</text>
  <text x="354" y="188" font-size="11" font-family="ui-monospace,Consolas,monospace" fill="#D9EEF6" fill-opacity="0.65" text-anchor="end" dominant-baseline="middle">UP 02:14:36</text>

  <!-- 5 小时 credit：值=剩余/总量，条=remaining/total（实心） -->
  <text x="36" y="214" font-size="12" font-weight="600" fill="#D9EEF6" dominant-baseline="middle">5 小时</text>
  <rect x="100" y="209" width="158" height="6" rx="3" fill="#7EC3DF" fill-opacity="0.12"/>
  <rect x="100" y="209" width="101" height="6" rx="3" fill="#7EC3DF"/>
  <text x="354" y="214" font-size="12" font-weight="600" font-family="ui-monospace,Consolas,monospace" fill="#7EC3DF" text-anchor="end" dominant-baseline="middle">6.4万 / 10万</text>

  <!-- 每周 credit -->
  <text x="36" y="240" font-size="12" font-weight="600" fill="#D9EEF6" dominant-baseline="middle">每周</text>
  <rect x="100" y="235" width="158" height="6" rx="3" fill="#7EC3DF" fill-opacity="0.12"/>
  <rect x="100" y="235" width="27" height="6" rx="3" fill="#E0BC5E"/>
  <text x="354" y="240" font-size="12" font-weight="600" font-family="ui-monospace,Consolas,monospace" fill="#E0BC5E" text-anchor="end" dominant-baseline="middle">1.7万 / 10万</text>

  <!-- 按钮 -->
  <rect x="36" y="258" width="318" height="52" rx="26" fill="#7EC3DF"/>
  <rect x="151" y="277" width="14" height="14" rx="3" fill="#0C2A38"/>
  <text x="201" y="284" font-size="16" font-weight="600" fill="#0C2A38" text-anchor="middle" dominant-baseline="middle">停止代理</text>

  <!-- 设计规格 -->
  <text x="16" y="386" font-size="12" font-weight="600" fill="#DEE7EA">设计规格 · start-plan（billing 平面，credit 制）· 深色</text>
  <rect x="16" y="400" width="10" height="10" rx="3" fill="#7EC3DF"/>
  <text x="34" y="409" font-size="11" fill="#9DAEB6">两行 = 5 小时 / 每周 credit · 单一总量池（非按模型拆分）</text>
  <rect x="16" y="418" width="10" height="10" rx="3" fill="#E0BC5E"/>
  <text x="34" y="427" font-size="11" fill="#9DAEB6">实心条 = remaining/total · 值文本与条同色</text>
  <text x="16" y="445" font-size="11" fill="#9DAEB6">阈值：≥30% primary · 10–30% warning · &lt;10% error</text>
  <text x="16" y="463" font-size="11" fill="#9DAEB6">重置时间未上图（极简取舍）· 点按整块刷新（网关限频）</text>
</svg>
